
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shahdol 3D Map</title>

<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100vh;
}

.header {
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 10;
    background: white;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #0003;
}

.header h2 {
    color: #222;
    font-size: 20px;
}

.header p {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.controls {
    position: absolute;
    bottom: 25px;
    left: 15px;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

button {
    border: none;
    padding: 12px 15px;
    border-radius: 8px;
    background: white;
    box-shadow: 0 2px 10px #0003;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #dceaff;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="header">
    <h2>📍 Shahdol 3D Map</h2>
    <p>Shahdol, Madhya Pradesh, India</p>
</div>

<div class="controls">
    <button onclick="resetMap()">🏠 Shahdol</button>
    <button onclick="rotateMap()">🔄 Rotate</button>
    <button onclick="myLocation()">📍 My Location</button>
    <button onclick="toggle3D()">🏙️ 2D / 3D</button>
</div>

<script>

// Shahdol Coordinates
const shahdol = [81.3619, 23.3015];

// Map initialization
const map = new maplibregl.Map({
    container: 'map',

    style: 'https://demotiles.maplibre.org/style.json',

    center: shahdol,

    zoom: 13,

    pitch: 60,

    bearing: -20,

    antialias: true
});

// Navigation controls
map.addControl(
    new maplibregl.NavigationControl(),
    'top-right'
);

// Fullscreen control
map.addControl(
    new maplibregl.FullscreenControl(),
    'top-right'
);

// Add Shahdol marker
const marker = new maplibregl.Marker({
    color: 'red'
})
.setLngLat(shahdol)
.setPopup(
    new maplibregl.Popup()
    .setHTML('<h3>Shahdol</h3><p>Madhya Pradesh, India</p>')
)
.addTo(map);

// Add 3D buildings where source data exists
map.on('load', () => {

    const layers = map.getStyle().layers;

    const labelLayer = layers.find(layer =>
        layer.type === 'symbol' &&
        layer.layout &&
        layer.layout['text-field']
    );

    if (map.getSource('openmaptiles') &&
        map.getStyle().layers.some(l => l['source-layer'] === 'building')) {

        map.addLayer({
            id: '3d-buildings',
            source: 'openmaptiles',
            'source-layer': 'building',
            type: 'fill-extrusion',

            minzoom: 13,

            paint: {
                'fill-extrusion-color': '#aaa',
                'fill-extrusion-height': [
                    'coalesce',
                    ['get', 'render_height'],
                    8
                ],
                'fill-extrusion-base': [
                    'coalesce',
                    ['get', 'render_min_height'],
                    0
                ],
                'fill-extrusion-opacity': 0.8
            }
        }, labelLayer ? labelLayer.id : undefined);
    }
});

// Reset view
function resetMap() {
    map.flyTo({
        center: shahdol,
        zoom: 13,
        pitch: 60,
        bearing: -20,
        duration: 2000
    });
}

// Rotate
function rotateMap() {
    map.easeTo({
        bearing: map.getBearing() + 90,
        pitch: 65,
        duration: 2000
    });
}

// 2D / 3D
let is3D = true;

function toggle3D() {
    is3D = !is3D;

    map.easeTo({
        pitch: is3D ? 60 : 0,
        bearing: is3D ? -20 : 0,
        duration: 1500
    });
}

// Current location
function myLocation() {

    if (!navigator.geolocation) {
        alert('Location not supported');
        return;
    }

    navigator.geolocation.getCurrentPosition(position => {

        const location = [
            position.coords.longitude,
            position.coords.latitude
        ];

        map.flyTo({
            center: location,
            zoom: 17,
            pitch: 60,
            duration: 2000
        });

        new maplibregl.Marker({color: 'blue'})
            .setLngLat(location)
            .setPopup(
                new maplibregl.Popup()
                .setText('Your Current Location')
            )
            .addTo(map);

    }, () => {
        alert('Location permission nahi mili.');
    });
}

</script>

</body>
</html>
